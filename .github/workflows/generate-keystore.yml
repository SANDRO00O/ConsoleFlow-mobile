name: Generate Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair             -alias metrolist             -keyalg RSA             -keysize 2048             -validity 10000             -keystore release.keystore             -storepass metrolist123             -keypass metrolist123             -dname "CN=Metrolist, OU=App, O=Metrolist, L=Unknown, ST=Unknown, C=US"

          echo ""
          echo "================================================"
          echo "  COPY THESE VALUES TO GITHUB SECRETS"
          echo "================================================"
          echo ""
          echo "Secret name: KEYSTORE_B64"
          echo "Secret value (copy everything between the lines):"
          echo "----"
          base64 -w 0 release.keystore
          echo ""
          echo "----"
          echo ""
          echo "Secret name: KEY_ALIAS"
          echo "Secret value: metrolist"
          echo ""
          echo "Secret name: KEYSTORE_PASSWORD"
          echo "Secret value: metrolist123"
          echo ""
          echo "Secret name: KEY_PASSWORD"
          echo "Secret value: metrolist123"
          echo ""
