name: Build & Replace Release

on:
  workflow_dispatch:

# يمنع تشغيلين متزامنين لنفس سير العمل — إصدار (release) هو عملية تُنشئ/
# تحذف tag فعلي على GitHub، وتشغيلان متوازيان قد يتصارعان على نفس الـtag.
concurrency:
  group: release-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK and Replace Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read metadata
        id: metadata
        run: |
          set -euo pipefail
          name=$(jq -r '.release_name' builddata.json)
          body=$(jq -r '.release_body' builddata.json)
          pre=$(jq -r '.is_prerelease' builddata.json)
          apk_name=$(jq -r '.apk_name' builddata.json)
          tag=$(jq -r '.tag' builddata.json)

          # فشل مبكر وواضح لو أي حقل مطلوب فاضي أو مفقود، بدل اكتشاف الخطأ
          # بعد 20 دقيقة من البناء عند خطوة الرفع.
          for field_name in name apk_name tag; do
            value="${!field_name}"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::builddata.json is missing a valid '$field_name' value"
              exit 1
            fi
          done

          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "pre=$pre" >> "$GITHUB_OUTPUT"
          echo "apk_custom_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Delete existing release if it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.metadata.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" -y
          fi

      # فشل مبكر وواضح لو أي سرّ توقيع ناقص، بدل فشل gradle بعد دقائق ببناء
      # فعلي برسالة خطأ أقل وضوحاً.
      - name: Verify signing secrets are present
        run: |
          missing=()
          [ -z "${{ secrets.KEYSTORE_B64 }}" ] && missing+=("KEYSTORE_B64")
          [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "${{ secrets.KEY_ALIAS }}" ] && missing+=("KEY_ALIAS")
          [ -z "${{ secrets.KEY_PASSWORD }}" ] && missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Restore keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-console.log

      # يحذف ملف الـkeystore فوراً بعد البناء، بنجاح أو فشل — لا يبقى ملف
      # توقيع حسّاس على قرص الـrunner لحظة أطول من اللازم.
      - name: Remove keystore file
        if: always()
        run: rm -f release.keystore

      - name: Locate and rename APK
        id: apk
        run: |
          set -euo pipefail
          original_path=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [ -z "$original_path" ]; then
            echo "::error::No release APK found under app/build/outputs/apk/release"
            exit 1
          fi
          new_name="${{ steps.metadata.outputs.apk_custom_name }}"
          new_path="app/build/outputs/apk/release/$new_name"
          mv "$original_path" "$new_path"
          echo "path=$new_path" >> "$GITHUB_OUTPUT"

      - name: Create new Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }}
          prerelease: ${{ steps.metadata.outputs.pre }}
          body: ${{ steps.metadata.outputs.body }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: |
            gradle-console.log
            **/build/outputs/logs/**
            **/build/reports/**
          if-no-files-found: warn
          retention-days: 7
