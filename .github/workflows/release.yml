name: Build & Replace Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Replace Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read Metadata
        id: metadata
        run: |
          NAME=$(jq -r '.release_name' builddata.json)
          BODY=$(jq -r '.release_body' builddata.json)
          PRE=$(jq -r '.is_prerelease' builddata.json)
          APK_NAME=$(jq -r '.apk_name' builddata.json)
          TAG=$(jq -r '.tag' builddata.json)

          echo "name=$NAME" >> $GITHUB_OUTPUT

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "pre=$PRE" >> $GITHUB_OUTPUT
          echo "apk_custom_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Delete existing release if it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.metadata.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate and Rename APK
        id: apk
        run: |
          ORIGINAL_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          NEW_NAME="${{ steps.metadata.outputs.apk_custom_name }}"
          NEW_PATH="app/build/outputs/apk/debug/$NEW_NAME"

          mv "$ORIGINAL_PATH" "$NEW_PATH"
          echo "path=$NEW_PATH" >> $GITHUB_OUTPUT

      - name: Create source archive
        id: source
        run: |
          SOURCE_NAME="source-${{ steps.metadata.outputs.tag }}.tar.gz"
          git archive --format=tar.gz --output="$SOURCE_NAME" HEAD
          echo "path=$SOURCE_NAME" >> $GITHUB_OUTPUT

      - name: Create new Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.name }}
          prerelease: ${{ steps.metadata.outputs.pre }}
          body: ${{ steps.metadata.outputs.body }}
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.source.outputs.path }}
          generate_release_notes: true