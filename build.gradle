// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
// ✅ إصلاح خطأ بناء حقيقي ثانٍ: androidx.core:core-ktx:1.18.0 (يُسحَب
// كاعتماد عابر عبر GeckoView على الأغلب) يتطلب AGP 8.9.1+ وcompileSdk 36+.
// اخترت 8.13.0 تحديداً (لا 9.x) لأنه آخر إصدار يدعم API 36 وهو لا يزال
// بخط AGP 8.x — يتجنّب كسر التوافق الكبير في AGP 9 (يزيل org.jetbrains.
// kotlin.android لصالح "built-in Kotlin"، وهو تغيير أكبر بكثير من اللازم
// هنا). تحقّقت من هذا عبر بحث مباشر، وليس تخميناً.
id 'com.android.application' version '8.13.0' apply false
id 'com.android.library' version '8.13.0' apply false
id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

task clean(type: Delete) {
delete rootProject.buildDir
}