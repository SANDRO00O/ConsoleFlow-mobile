plugins {
id 'com.android.application'
id 'org.jetbrains.kotlin.android'
}

android {
namespace 'space.karrarnazim.ConsoleFlow'
compileSdk 35

defaultConfig {
applicationId "space.karrarnazim.ConsoleFlow"
minSdk 22
targetSdk 35
versionCode 16
versionName "3.0.0"
}

signingConfigs {
release {
storeFile file(System.getenv("KEYSTORE_FILE") ?: "$rootDir/release.keystore")
storePassword System.getenv("KEYSTORE_PASSWORD")
keyAlias System.getenv("KEY_ALIAS")
keyPassword System.getenv("KEY_PASSWORD")
// V1 (JAR signing) is required for Android < 7.0 (API 24).
// Without it, Android 5/6 shows "parse error" because V2-only APKs
// cannot be verified on those devices.
v1SigningEnabled true
v2SigningEnabled true
}
}

buildTypes {
release {
signingConfig signingConfigs.release
minifyEnabled true
proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
}
}
compileOptions {
sourceCompatibility JavaVersion.VERSION_17
targetCompatibility JavaVersion.VERSION_17
}
kotlinOptions {
jvmTarget = '17'
}
buildFeatures {
viewBinding true
}
}

// ── مستودع Mozilla Maven (مطلوب لـ GeckoView) ──────────────────────────────
// تمت إضافته في settings.gradle (dependencyResolutionManagement) بدل هنا —
// FAIL_ON_PROJECT_REPOS يمنع أي repositories{} على مستوى الموديول.

dependencies {
implementation 'androidx.core:core-ktx:1.13.1'
implementation 'androidx.appcompat:appcompat:1.7.0'
implementation "androidx.core:core-splashscreen:1.0.1"
implementation 'com.squareup.okhttp3:okhttp:4.12.0'
implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
implementation 'com.google.android.material:material:1.12.0'
implementation 'androidx.recyclerview:recyclerview:1.3.2'
implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

// ── GeckoView (محرك متصفح مستقل، Mozilla) ──────────────────────────────
// حل محل androidx.webkit بالكامل — لم يعد هناك أي اعتماد على WebView
// النظامي.
// ✅ إصلاح خطأ بناء حقيقي: الرقم القديم (128.3.0) لم يكن موجوداً إطلاقاً في
// مستودع Mozilla — سبّب فشل البناء الفعلي (رسالة الخطأ التي أرسلتها).
// الرقم أدناه تحقّقت منه بجلب فعلي مباشر من mvnrepository.com/artifact/
// org.mozilla.geckoview/geckoview وهو أحدث إصدار منشور فعلياً حتى تاريخه.
// لو ظهر أحدث منه عند البناء، حدّثه من نفس الرابط.
implementation "org.mozilla.geckoview:geckoview:150.0.20260511200624"
}
